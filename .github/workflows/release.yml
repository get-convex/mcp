name: Release

# Publishes to npm when a version tag (v*) is pushed, using npm **trusted
# publishing** (OIDC) — no stored token. Provenance is attested automatically.
# The dist-tag is derived from the version: a prerelease like 0.1.0-alpha.0
# publishes under `alpha`, a plain 0.1.0 under `latest`.
#
# Setup (one time, on npmjs.com): the package settings for
# @convex-dev/mcp → "Trusted Publisher" → GitHub Actions, pointing at
# repo get-convex/mcp and workflow file `release.yml`.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24 # trusted publishing needs Node >= 22.14
          registry-url: "https://registry.npmjs.org"
      # ...and npm >= 11.5.1
      - run: npm install -g npm@latest
      - name: Check tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Publish (trusted publishing, no token)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"; TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing @convex-dev/mcp@$VERSION under dist-tag: $TAG"
          npm publish --tag "$TAG" --access public
